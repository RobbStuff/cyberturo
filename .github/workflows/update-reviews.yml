name: Update reviews and extras

on:
  schedule:
    # 1st of each month at 12:00 UTC
    - cron: '0 12 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch public Turo reviews and extras
        run: node scripts/update-reviews.mjs

      - name: Commit if changed
        run: |
          if git diff --quiet -- reviews.json extras.json; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reviews.json extras.json
          git commit -m "chore: refresh reviews.json and extras.json from public Turo data"
          git push origin HEAD:main
