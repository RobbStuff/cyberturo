<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CyberTuro — Our Extras</title>
<meta name="description" content="Optional extras available with the CyberTuro Tesla fleet on Turo.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg0:#050705;
    --bg1:#080b08;
    --text:#e8ffe8;
    --muted:#8aa88a;
    --neon:#39ff14;
    --cyan:#00e5ff;
    --radius:18px;
  }
  * { box-sizing:border-box; }
  html { scroll-behavior:smooth; }
  body {
    margin:0;
    font-family: Rajdhani, "Segoe UI", system-ui, -apple-system, sans-serif;
    color:var(--text);
    background-color:var(--bg0);
    background-image:
      linear-gradient(rgba(57,255,20,.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(57,255,20,.03) 1px, transparent 1px),
      repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,.12) 3px),
      radial-gradient(900px 500px at 15% -10%, rgba(57,255,20,.12), transparent 55%),
      radial-gradient(700px 400px at 100% 0%, rgba(0,229,255,.08), transparent 50%),
      linear-gradient(180deg, var(--bg0), var(--bg1) 50%, #040604);
    background-size:48px 48px, 48px 48px, 100% 4px, auto, auto, auto;
    min-height:100vh;
  }
  .wrap {
    width:min(900px, calc(100% - 2rem));
    margin:0 auto;
    padding:2.5rem 0 4rem;
    position:relative;
    z-index:1;
  }
  .hero {
    text-align:center;
    padding:2.2rem 1.2rem 1.8rem;
    position:relative;
  }
  .menu {
    position:absolute;
    top:.35rem; right:.15rem;
    z-index:50;
  }
  .menu-toggle {
    display:inline-flex;
    flex-direction:column;
    justify-content:center;
    gap:5px;
    width:2.75rem; height:2.75rem;
    min-width:44px; min-height:44px;
    padding:0;
    border-radius:12px;
    border:1px solid rgba(57,255,20,.45);
    background:rgba(5,7,5,.85);
    color:var(--neon);
    cursor:pointer;
    box-shadow:0 0 14px rgba(57,255,20,.22);
    backdrop-filter:blur(8px);
    transition:background .2s ease, border-color .2s ease, box-shadow .2s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .menu-toggle:hover,
  .menu-toggle:focus-visible {
    background:rgba(57,255,20,.14);
    border-color:rgba(57,255,20,.8);
    box-shadow:0 0 18px rgba(57,255,20,.4);
    outline:none;
  }
  .menu-toggle:focus-visible {
    outline:2px solid var(--neon);
    outline-offset:2px;
  }
  .menu-toggle .bar {
    display:block;
    width:1.15rem; height:2px;
    margin:0 auto;
    border-radius:2px;
    background:currentColor;
    box-shadow:0 0 6px rgba(57,255,20,.55);
  }
  .menu-panel {
    position:absolute;
    top:calc(100% + .45rem);
    right:0;
    min-width:9.5rem;
    padding:.35rem;
    border-radius:12px;
    border:1px solid rgba(57,255,20,.4);
    background:rgba(5,7,5,.95);
    box-shadow:0 0 20px rgba(57,255,20,.2), 0 12px 28px rgba(0,0,0,.55);
    backdrop-filter:blur(10px);
  }
  .menu-panel[hidden] { display:none; }
  .menu-panel a {
    display:block;
    padding:.7rem .9rem;
    border-radius:8px;
    color:var(--text);
    text-decoration:none;
    font-family: Orbitron, Rajdhani, sans-serif;
    font-size:.85rem;
    font-weight:700;
    letter-spacing:.08em;
    text-transform:uppercase;
  }
  .menu-panel a:hover,
  .menu-panel a:focus-visible {
    background:rgba(57,255,20,.12);
    color:var(--neon);
    outline:none;
  }
  .brand {
    display:block;
    width:100%;
    max-width:100%;
    box-sizing:border-box;
    font-family: Orbitron, Rajdhani, "Segoe UI", sans-serif;
    font-weight:800;
    font-size:clamp(2rem, 6.4vw, 3.6rem);
    letter-spacing:clamp(.06em, 1.8vw, .18em);
    padding-left:clamp(.06em, 1.8vw, .18em);
    text-transform:uppercase;
    text-align:center;
    color:var(--neon);
    text-shadow:0 0 10px rgba(57,255,20,.7), 0 0 30px rgba(57,255,20,.35);
    margin:0 auto .9rem;
    line-height:1.15;
    text-decoration:none;
  }
  .brand:hover,
  .brand:focus-visible { color:#f0fff0; outline:none; }
  h1 {
    display:block;
    width:100%;
    margin:0 auto .85rem;
    font-family: Orbitron, Rajdhani, "Segoe UI", sans-serif;
    font-size:clamp(1.2rem, 3.6vw, 2.05rem);
    line-height:1.2;
    letter-spacing:.04em;
    padding-left:.04em;
    font-weight:800;
    text-align:center;
    color:#f0fff0;
    text-shadow:0 0 8px rgba(57,255,20,.55), 0 0 24px rgba(57,255,20,.25), 0 0 2px rgba(0,229,255,.35);
  }
  .back-link {
    display:inline-block;
    margin:0 auto 1.6rem;
    color:var(--cyan);
    text-decoration:none;
    font-family: Orbitron, Rajdhani, sans-serif;
    font-size:.8rem;
    letter-spacing:.08em;
    text-transform:uppercase;
    text-shadow:0 0 8px rgba(0,229,255,.35);
  }
  .back-link:hover,
  .back-link:focus-visible { color:var(--neon); outline:none; }
  .hero-links { text-align:center; }
  .fleet-extras {
    display:flex;
    flex-direction:column;
    gap:1.35rem;
  }
  .vehicle-extras {
    display:grid;
    grid-template-columns:132px 1fr;
    gap:1rem;
    padding:1rem;
    border-radius:var(--radius);
    border:1px solid rgba(57,255,20,.28);
    background:linear-gradient(180deg, rgba(57,255,20,.05), rgba(0,0,0,.28));
    box-shadow:0 0 18px rgba(57,255,20,.08);
  }
  @media (max-width:560px) {
    .vehicle-extras { grid-template-columns:1fr; }
  }
  .vehicle-photo {
    width:100%;
    aspect-ratio:4/3;
    object-fit:cover;
    border-radius:12px;
    border:1px solid rgba(57,255,20,.25);
    background:#030503;
  }
  .vehicle-name {
    margin:0;
    font-family: Orbitron, Rajdhani, sans-serif;
    font-size:clamp(1.25rem, 2.8vw, 1.55rem);
    font-weight:800;
    letter-spacing:.04em;
    color:#f5fff5;
    text-shadow:0 0 8px rgba(57,255,20,.35);
  }
  .vehicle-model {
    margin:.15rem 0 .7rem;
    font-family: Orbitron, Rajdhani, sans-serif;
    font-size:.9rem;
    font-weight:600;
    letter-spacing:.03em;
    color:var(--muted);
  }
  .extras-note {
    margin:0 0 .55rem;
    font-size:.88rem;
    color:var(--cyan);
  }
  .extras-list {
    list-style:none;
    margin:0;
    padding:0;
    display:flex;
    flex-direction:column;
    gap:.55rem;
  }
  .extras-list li {
    padding:.55rem .7rem;
    border-radius:10px;
    border:1px solid rgba(57,255,20,.16);
    background:rgba(57,255,20,.04);
  }
  .extra-top {
    display:flex;
    flex-wrap:wrap;
    gap:.35rem .75rem;
    align-items:baseline;
    justify-content:space-between;
  }
  .extra-name {
    font-weight:700;
    font-size:1.02rem;
    color:#efffef;
  }
  .extra-price {
    font-family: Orbitron, Rajdhani, sans-serif;
    font-size:.82rem;
    letter-spacing:.04em;
    color:var(--neon);
  }
  .extra-desc {
    margin:.25rem 0 0;
    color:var(--muted);
    font-size:.95rem;
    line-height:1.35;
  }
  .placeholder {
    text-align:center;
    padding:2.4rem 1.2rem;
    border-radius:var(--radius);
    border:1px dashed rgba(57,255,20,.35);
    background:rgba(57,255,20,.04);
  }
  .placeholder h2 {
    margin:0 0 .55rem;
    font-family: Orbitron, Rajdhani, sans-serif;
    font-size:1.15rem;
    letter-spacing:.06em;
    color:var(--neon);
  }
  .placeholder p {
    margin:0;
    color:var(--muted);
    font-size:1.05rem;
  }
  .empty-extras {
    margin:0;
    color:var(--muted);
    font-size:.95rem;
  }
  footer { text-align:center; color:var(--muted); margin-top:2.5rem; font-size:.95rem; }
  footer a { color:var(--cyan); text-shadow:0 0 8px rgba(0,229,255,.35); }
</style>
</head>
<body>
  <div class="wrap">
    <header class="hero">
      <div class="menu" id="site-menu">
        <button type="button" class="menu-toggle" id="menu-toggle" aria-label="Open menu" aria-expanded="false" aria-controls="menu-panel">
          <span class="bar" aria-hidden="true"></span>
          <span class="bar" aria-hidden="true"></span>
          <span class="bar" aria-hidden="true"></span>
        </button>
        <div class="menu-panel" id="menu-panel" role="menu" hidden>
          <a href="reviews.html" id="reviews-link" role="menuitem">Our Reviews</a>
          <a href="extras.html" id="extras-link" role="menuitem" aria-current="page">Our Extras</a>
          <a href="#" id="login-link" role="menuitem">Login</a>
        </div>
      </div>
      <a class="brand" href="index.html">CyberTuro</a>
      <h1>Our Extras</h1>
      <div class="hero-links">
        <a class="back-link" href="index.html">← Back to our fleet</a>
      </div>
    </header>

    <main id="extras-root" class="fleet-extras" aria-live="polite">
      <div class="placeholder">
        <h2>Loading extras…</h2>
        <p>Checking each vehicle’s public Turo listing.</p>
      </div>
    </main>

    <footer>
      <a href="index.html">Fleet</a> ·
      <a href="reviews.html">Our Reviews</a> ·
      <a href="https://turo.com/host/16034992" target="_blank" rel="noopener">Turo host profile</a>
    </footer>
  </div>
<script>
(function() {
  const menuRoot = document.getElementById('site-menu');
  const menuBtn = document.getElementById('menu-toggle');
  const menuPanel = document.getElementById('menu-panel');
  function setMenuOpen(open) {
    if (!menuBtn || !menuPanel) return;
    menuPanel.hidden = !open;
    menuBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
    menuBtn.setAttribute('aria-label', open ? 'Close menu' : 'Open menu');
  }
  if (menuBtn && menuPanel) {
    menuBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      setMenuOpen(menuPanel.hidden);
    });
    document.addEventListener('click', (e) => {
      if (menuPanel.hidden) return;
      if (menuRoot && !menuRoot.contains(e.target)) setMenuOpen(false);
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && !menuPanel.hidden) {
        setMenuOpen(false);
        menuBtn.focus();
      }
    });
  }

  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function formatPrice(price, unit) {
    if (price == null || price === '') return '';
    const n = Number(price);
    const money = Number.isFinite(n) ? ('$' + n.toFixed(n % 1 ? 2 : 0)) : String(price);
    return money + (unit ? (' ' + unit) : '');
  }

  function showGlobalPlaceholder(message) {
    document.getElementById('extras-root').innerHTML =
      '<div class="placeholder">' +
        '<h2>Extras list coming soon</h2>' +
        '<p>' + escapeHtml(message || 'Optional extras from each public Turo listing will appear here once available.') + '</p>' +
      '</div>';
  }

  function render(data) {
    const root = document.getElementById('extras-root');
    const vehicles = Array.isArray(data?.vehicles) ? data.vehicles : [];
    const anyExtras = vehicles.some((v) => Array.isArray(v.extras) && v.extras.length);

    if (!vehicles.length || (data?.placeholder && !anyExtras)) {
      showGlobalPlaceholder(data?.message || 'Extras list coming soon');
      return;
    }

    root.innerHTML = vehicles.map((v) => {
      const extras = Array.isArray(v.extras) ? v.extras : [];
      const listHtml = extras.length
        ? ('<ul class="extras-list">' + extras.map((e) => (
            '<li>' +
              '<div class="extra-top">' +
                '<span class="extra-name">' + escapeHtml(e.name || '') + '</span>' +
                '<span class="extra-price">' + escapeHtml(formatPrice(e.price, e.unit)) + '</span>' +
              '</div>' +
              (e.description ? ('<p class="extra-desc">' + escapeHtml(e.description) + '</p>') : '') +
            '</li>'
          )).join('') + '</ul>')
        : '<p class="empty-extras">No extras listed for this vehicle yet.</p>';
      const note = v.extrasNote
        ? ('<p class="extras-note">' + escapeHtml(v.extrasNote) + '</p>')
        : '';
      return (
        '<article class="vehicle-extras">' +
          '<img class="vehicle-photo" src="' + escapeHtml(v.photo || ('images/' + v.listingId + '_1.jpg')) + '" alt="' + escapeHtml(v.name || '') + '" loading="lazy">' +
          '<div>' +
            '<h2 class="vehicle-name">“' + escapeHtml(v.name || '') + '”</h2>' +
            '<p class="vehicle-model">' + escapeHtml(v.model || '') + '</p>' +
            note +
            listHtml +
          '</div>' +
        '</article>'
      );
    }).join('');
  }

  fetch('extras.json', { cache: 'no-store' })
    .then((res) => (res.ok ? res.json() : null))
    .then((data) => {
      if (!data) showGlobalPlaceholder();
      else render(data);
    })
    .catch(() => showGlobalPlaceholder());
})();
</script>
</body>
</html>
