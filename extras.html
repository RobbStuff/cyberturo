<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CyberTuro — Our Extras</title>
<meta name="description" content="Optional extras available with the CyberTuro Tesla fleet on Turo.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg0:#050705;
    --bg1:#080b08;
    --text:#e8ffe8;
    --muted:#8aa88a;
    --neon:#39ff14;
    --cyan:#00e5ff;
    --radius:18px;
    --site-header-h:2.75rem;
    --fleet-note-size:clamp(.875rem, 2.8vw, 1rem);
    /* Matches measured CyberTuro→NEW visible gap (brand mb .9rem + note vertical centering) */
    --brand-stack-gap:calc(.9rem + (2.6rem - 1.4 * var(--fleet-note-size)) / 2 + .14rem);
    --site-header-offset:calc(var(--site-header-h) + env(safe-area-inset-top, 0px));
  }
  * { box-sizing:border-box; }
  html {
    scroll-behavior:smooth;
  }
  body {
    margin:0;
    font-family: Rajdhani, "Segoe UI", system-ui, -apple-system, sans-serif;
    color:var(--text);
    background-color:var(--bg0);
    background-image:
      linear-gradient(rgba(57,255,20,.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(57,255,20,.03) 1px, transparent 1px),
      repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,.12) 3px),
      radial-gradient(900px 500px at 15% -10%, rgba(57,255,20,.12), transparent 55%),
      radial-gradient(700px 400px at 100% 0%, rgba(0,229,255,.08), transparent 50%),
      linear-gradient(180deg, var(--bg0), var(--bg1) 50%, #040604);
    background-size:48px 48px, 48px 48px, 100% 4px, auto, auto, auto;
    min-height:100vh;
  }
  .site-header {
    position:fixed;
    top:0;
    left:0;
    right:0;
    z-index:500;
    height:var(--site-header-offset);
    display:flex;
    align-items:center;
    box-sizing:border-box;
    padding:env(safe-area-inset-top, 0px) 1rem 0;
    background:#050705;
    border-bottom:1px solid rgba(57,255,20,.12);
    transform:none;
    -webkit-transform:none;
  }
  .wrap {
    width:min(900px, calc(100% - 2rem));
    margin:0 auto;
    padding:var(--site-header-offset) 0 4rem;
    position:relative;
    z-index:1;
  }
  .hero {
    text-align:center;
    padding:0 1.2rem 1.8rem;
    position:relative;
  }
  .top-nav {
    display:flex;
    flex-wrap:nowrap;
    align-items:center;
    justify-content:space-between;
    gap:0;
    width:100%;
    margin:0;
    padding:0;
    white-space:nowrap;
    font-family: Orbitron, Rajdhani, sans-serif;
    font-size:clamp(.72rem, 2.4vw, .88rem);
    font-weight:700;
    letter-spacing:.06em;
    text-transform:none;
    color:#ff8c1a;
    line-height:1.4;
  }
  .top-nav a {
    color:#ff8c1a;
    text-decoration:none;
    white-space:nowrap;
    font-weight:700;
    transition:color .2s ease, text-shadow .2s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .top-nav a:hover,
  .top-nav a:focus-visible {
    color:#ffb35a;
    text-shadow:0 0 10px rgba(255,140,26,.55);
    outline:none;
  }
  .top-nav a:focus-visible {
    outline:2px solid #ff8c1a;
    outline-offset:2px;
  }
  .top-nav .dot {
    color:#ff8c1a;
    font-weight:700;
    white-space:pre;
  }
  .brand {
    display:block;
    width:100%;
    box-sizing:border-box;
    font-family: Orbitron, Rajdhani, "Segoe UI", sans-serif;
    font-weight:800;
    font-size:clamp(2rem, 6.4vw, 3.6rem);
    letter-spacing:clamp(.04em, 1.4vw, .16em);
    text-transform:uppercase;
    text-align:center;
    color:var(--neon);
    text-shadow:0 0 10px rgba(57,255,20,.7), 0 0 30px rgba(57,255,20,.35);
    margin:var(--brand-stack-gap) 0 .9rem;
    line-height:1.1;
    overflow-wrap:normal;
    text-decoration:none;
  }
  .brand:hover,
  .brand:focus-visible { color:#f0fff0; outline:none; }
  h1 {
    display:block;
    width:100%;
    margin:0 auto .85rem;
    font-family: Orbitron, Rajdhani, "Segoe UI", sans-serif;
    font-size:clamp(1.2rem, 3.6vw, 2.05rem);
    line-height:1.2;
    letter-spacing:.04em;
    padding-left:.04em;
    font-weight:800;
    text-align:center;
    color:#f0fff0;
    text-shadow:0 0 8px rgba(57,255,20,.55), 0 0 24px rgba(57,255,20,.25), 0 0 2px rgba(0,229,255,.35);
  }
  .back-link {
    display:inline-flex;
    align-items:center;
    gap:.28rem;
    margin:0 0 .55rem;
    color:var(--neon);
    text-decoration:none;
    font-family: Orbitron, Rajdhani, sans-serif;
    font-size:.8rem;
    font-weight:700;
    letter-spacing:.08em;
    text-transform:uppercase;
    line-height:1.2;
    -webkit-tap-highlight-color: transparent;
  }
  .back-link:hover,
  .back-link:focus-visible {
    color:#b8ff7a;
    outline:none;
  }
  .back-link:focus-visible {
    outline:2px solid var(--neon);
    outline-offset:2px;
  }
  .fleet-extras {
    display:flex;
    flex-direction:column;
    gap:1.25rem;
  }
  .vehicle-extras {
    display:flex;
    flex-direction:column;
    gap:.85rem;
    padding:1rem;
    border-radius:var(--radius);
    border:1px solid rgba(57,255,20,.28);
    background:linear-gradient(180deg, rgba(57,255,20,.05), rgba(0,0,0,.28));
    box-shadow:0 0 18px rgba(57,255,20,.08);
  }
  .vehicle-head {
    display:grid;
    grid-template-columns:68px 1fr;
    gap:.85rem;
    align-items:center;
  }
  .vehicle-photo {
    width:68px;
    height:68px;
    object-fit:cover;
    border-radius:10px;
    border:1px solid rgba(57,255,20,.25);
    background:#030503;
    flex-shrink:0;
  }
  .vehicle-name {
    margin:0;
    font-family: Orbitron, Rajdhani, sans-serif;
    font-size:clamp(1.05rem, 2.4vw, 1.25rem);
    font-weight:700;
    letter-spacing:.04em;
    color:var(--neon);
    text-shadow:0 0 8px rgba(57,255,20,.35);
  }
  .vehicle-model {
    margin:.15rem 0 0;
    font-family: Orbitron, Rajdhani, sans-serif;
    font-size:.9rem;
    font-weight:700;
    letter-spacing:.03em;
    color:#ff8c1a;
  }
  .extras-note {
    margin:0;
    font-size:.88rem;
    color:var(--cyan);
  }
  .extras-grid {
    --extra-tile-pad-x: .65rem;
    --extra-tile-pad-y: .48rem;
    --extra-name-size: .85rem;
    --extra-price-size: .73rem;
    --extra-gap: .5rem;
    --extra-tile-min-h: 3.55rem;
    display:grid;
    /* Exactly 2 equal columns on all screen sizes, filling content width. */
    grid-template-columns:repeat(2, minmax(0, 1fr));
    gap:var(--extra-gap);
    justify-content:stretch;
    justify-items:stretch;
    align-items:stretch;
    width:100%;
  }
  @media (min-width:768px) {
    .extras-grid {
      --extra-tile-min-h: 3.7rem;
      --extra-gap: .55rem;
    }
  }
  .extra-tile {
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:.22rem;
    box-sizing:border-box;
    width:100%;
    min-width:0;
    min-height:var(--extra-tile-min-h);
    margin:0;
    padding:var(--extra-tile-pad-y) var(--extra-tile-pad-x);
    border-radius:12px;
    border:1px solid rgba(57,255,20,.2);
    background:rgba(57,255,20,.04);
    color:inherit;
    font:inherit;
    text-align:center;
    cursor:pointer;
    -webkit-tap-highlight-color: transparent;
    transition:border-color .2s ease, background .2s ease, box-shadow .2s ease;
  }
  .extra-tile:hover,
  .extra-tile:focus-visible {
    border-color:rgba(57,255,20,.55);
    background:rgba(57,255,20,.08);
    outline:none;
  }
  .extra-tile.is-open {
    border-color:rgba(255,140,26,.65);
    box-shadow:0 0 12px rgba(255,140,26,.18);
  }
  .extra-name {
    margin:0;
    width:100%;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:clip;
    font-weight:700;
    font-size:var(--extra-name-size);
    line-height:1.15;
    letter-spacing:.01em;
    color:#efffef;
  }
  .extra-price {
    margin:0;
    font-family: Orbitron, Rajdhani, sans-serif;
    font-size:var(--extra-price-size);
    font-weight:700;
    letter-spacing:.03em;
    color:#ff8c1a;
    line-height:1.2;
    white-space:nowrap;
  }
  .extra-detail {
    grid-column:1 / -1;
    padding:.7rem .8rem;
    border-radius:12px;
    border:1px solid rgba(255,140,26,.35);
    background:linear-gradient(180deg, rgba(255,140,26,.08), rgba(0,0,0,.22));
    box-shadow:0 0 14px rgba(255,140,26,.1);
  }
  .extra-detail-title {
    margin:0 0 .3rem;
    font-family: Orbitron, Rajdhani, sans-serif;
    font-size:.88rem;
    font-weight:700;
    letter-spacing:.03em;
    color:var(--neon);
  }
  .extra-detail-price {
    margin:0 0 .45rem;
    font-size:.8rem;
    color:#ff8c1a;
    font-weight:700;
  }
  .extra-detail-desc {
    margin:0;
    font-size:1.02rem;
    line-height:1.45;
    color:#efffef;
  }
  .placeholder {
    text-align:center;
    padding:2.4rem 1.2rem;
    border-radius:var(--radius);
    border:1px dashed rgba(57,255,20,.35);
    background:rgba(57,255,20,.04);
  }
  .placeholder h2 {
    margin:0 0 .55rem;
    font-family: Orbitron, Rajdhani, sans-serif;
    font-size:1.15rem;
    letter-spacing:.06em;
    color:var(--neon);
  }
  .placeholder p {
    margin:0;
    color:var(--muted);
    font-size:1.05rem;
  }
  .empty-extras {
    margin:0;
    color:var(--muted);
    font-size:.95rem;
  }
  footer { text-align:center; color:var(--muted); margin-top:2.5rem; font-size:.95rem; }
  footer a { color:var(--cyan); text-shadow:0 0 8px rgba(0,229,255,.35); }
</style>
</head>
<body>
  <header class="site-header">
    <nav class="top-nav" aria-label="Site">
      <a href="index.html">Fleet</a><span class="dot" aria-hidden="true">.</span><a href="reviews.html">Reviews</a><span class="dot" aria-hidden="true">.</span><a href="extras.html">Extras</a><span class="dot" aria-hidden="true">.</span><a href="#" id="login-link">Login</a>
    </nav>
  </header>
  <div class="wrap">
    <header class="hero">
      <a class="brand" href="index.html">CyberTuro</a>
      <h1>Our Extras</h1>
    </header>

    <a class="back-link" href="index.html" aria-label="Back to our fleet">‹ Back</a>

    <main id="extras-root" class="fleet-extras" aria-live="polite">
      <div class="placeholder">
        <h2>Loading extras…</h2>
        <p>Checking each vehicle’s public Turo listing.</p>
      </div>
    </main>

    <footer>
      <a href="index.html">Fleet</a> ·
      <a href="reviews.html">Our Reviews</a> ·
      <a href="https://turo.com/host/16034992" target="_blank" rel="noopener">Turo host profile</a>
    </footer>
  </div>
<script>
(function() {
  document.querySelector('.back-link')?.addEventListener('click', function(e) {
    e.preventDefault();
    let sameSite = false;
    try {
      if (document.referrer) sameSite = new URL(document.referrer).origin === location.origin;
    } catch (_) {}
    if (sameSite) { history.back(); return; }
    location.href = 'index.html';
  });

  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function formatPrice(price, unit) {
    if (price == null || price === '') return '';
    const n = Number(price);
    const money = Number.isFinite(n) ? ('$' + n.toFixed(n % 1 ? 2 : 0)) : String(price);
    return money + (unit ? (' ' + unit) : '');
  }

  function showGlobalPlaceholder(message) {
    document.getElementById('extras-root').innerHTML =
      '<div class="placeholder">' +
        '<h2>Extras list coming soon</h2>' +
        '<p>' + escapeHtml(message || 'Optional extras from each public Turo listing will appear here once available.') + '</p>' +
      '</div>';
  }

  function closeOpenInCar(car) {
    if (!car) return;
    car.querySelectorAll('.extra-tile.is-open').forEach((tile) => {
      tile.classList.remove('is-open');
      tile.setAttribute('aria-expanded', 'false');
    });
    car.querySelectorAll('.extra-detail').forEach((panel) => panel.remove());
  }

  function gridColumnCount(grid) {
    const styles = getComputedStyle(grid);
    const cols = styles.gridTemplateColumns.split(' ').filter(Boolean).length;
    return Math.max(1, cols);
  }

  function openDetail(tile) {
    const car = tile.closest('.vehicle-extras');
    const grid = tile.closest('.extras-grid');
    if (!car || !grid) return;
    const alreadyOpen = tile.classList.contains('is-open');
    closeOpenInCar(car);
    if (alreadyOpen) return;

    tile.classList.add('is-open');
    tile.setAttribute('aria-expanded', 'true');

    const name = tile.getAttribute('data-name') || '';
    const price = tile.getAttribute('data-price') || '';
    const desc = decodeURIComponent(tile.getAttribute('data-desc') || '');
    const panel = document.createElement('div');
    panel.className = 'extra-detail';
    panel.innerHTML =
      '<p class="extra-detail-title">' + escapeHtml(name) + '</p>' +
      (price ? ('<p class="extra-detail-price">' + escapeHtml(price) + '</p>') : '') +
      (desc ? ('<p class="extra-detail-desc">' + escapeHtml(desc) + '</p>') : '<p class="extra-detail-desc">No description available.</p>');

    const tiles = [...grid.querySelectorAll('.extra-tile')];
    const index = tiles.indexOf(tile);
    const cols = gridColumnCount(grid);
    const rowEnd = Math.min(tiles.length - 1, (Math.floor(index / cols) + 1) * cols - 1);
    const anchor = tiles[rowEnd];
    if (anchor && anchor.nextSibling) grid.insertBefore(panel, anchor.nextSibling);
    else grid.appendChild(panel);
  }

  function measureTitleWidth(titles, fontSizePx, fontWeight, fontFamily, letterSpacing) {
    const probe = document.createElement('span');
    probe.style.cssText = 'position:absolute;left:-9999px;top:0;white-space:nowrap;visibility:hidden;';
    probe.style.fontSize = fontSizePx + 'px';
    probe.style.fontWeight = fontWeight;
    probe.style.fontFamily = fontFamily;
    probe.style.letterSpacing = letterSpacing;
    document.body.appendChild(probe);
    let max = 0;
    titles.forEach((t) => {
      probe.textContent = t;
      max = Math.max(max, probe.getBoundingClientRect().width);
    });
    probe.remove();
    return max;
  }

  function sizeExtraTiles() {
    const grids = [...document.querySelectorAll('.extras-grid')];
    if (!grids.length) return;
    const titles = [...document.querySelectorAll('.extra-tile .extra-name')]
      .map((el) => el.textContent.trim())
      .filter(Boolean);
    if (!titles.length) return;

    const sample = grids[0];
    const cols = 2; // exactly 2 equal columns on all breakpoints
    let nameSize = 0.85;
    let priceSize = 0.73;
    let padX = 0.65;
    let padY = 0.48;
    const gap = window.innerWidth >= 768 ? 0.55 : 0.5;

    function remPx() {
      return parseFloat(getComputedStyle(document.documentElement).fontSize) || 16;
    }

    function applyVars() {
      grids.forEach((grid) => {
        grid.style.setProperty('--extra-name-size', nameSize + 'rem');
        grid.style.setProperty('--extra-price-size', priceSize + 'rem');
        grid.style.setProperty('--extra-tile-pad-x', padX + 'rem');
        grid.style.setProperty('--extra-tile-pad-y', padY + 'rem');
        grid.style.setProperty('--extra-gap', gap + 'rem');
      });
    }

    function titleMetrics() {
      const rem = remPx();
      const nameEl = sample.querySelector('.extra-name');
      const cs = nameEl ? getComputedStyle(nameEl) : getComputedStyle(sample);
      const titleW = measureTitleWidth(
        titles,
        nameSize * rem,
        cs.fontWeight || '700',
        cs.fontFamily || 'Rajdhani, sans-serif',
        cs.letterSpacing || '0.01em'
      );
      return { rem, titleW, minW: titleW + padX * 2 * rem + 2 };
    }

    const parent = sample.parentElement || sample;
    const parentStyle = getComputedStyle(parent);
    const avail = Math.max(
      0,
      parent.clientWidth
        - (parseFloat(parentStyle.paddingLeft) || 0)
        - (parseFloat(parentStyle.paddingRight) || 0)
    ) || sample.clientWidth || window.innerWidth;

    // Largest readable font that keeps the longest title on one line in a 2-col cell.
    const fontSteps = [
      { name: 1.05, price: 0.88, padX: 0.75, padY: 0.55 },
      { name: 1.0, price: 0.84, padX: 0.72, padY: 0.55 },
      { name: 0.95, price: 0.8, padX: 0.7, padY: 0.52 },
      { name: 0.92, price: 0.78, padX: 0.55, padY: 0.5 },
      { name: 0.9, price: 0.76, padX: 0.5, padY: 0.48 },
      { name: 0.85, price: 0.73, padX: 0.55, padY: 0.45 },
      { name: 0.8, price: 0.68, padX: 0.5, padY: 0.42 }
    ];

    let chosen = null;
    for (const step of fontSteps) {
      nameSize = step.name;
      priceSize = step.price;
      padX = step.padX;
      padY = step.padY;
      const { rem, minW } = titleMetrics();
      const gapPx = gap * rem;
      const cellW = (avail - (cols - 1) * gapPx) / cols;
      if (cellW + 0.5 >= minW) {
        chosen = step;
        break;
      }
    }
    if (!chosen) {
      nameSize = 0.8;
      priceSize = 0.68;
      padX = 0.5;
      padY = 0.42;
      let { rem, minW } = titleMetrics();
      let gapPx = gap * rem;
      let cellW = (avail - (cols - 1) * gapPx) / cols;
      for (let i = 0; i < 24 && cellW + 0.5 < minW; i++) {
        nameSize = Math.round(Math.max(0.55, nameSize - 0.02) * 100) / 100;
        priceSize = Math.round(Math.max(0.48, priceSize - 0.015) * 100) / 100;
        padX = Math.round(Math.max(0.28, padX - 0.02) * 100) / 100;
        padY = Math.round(Math.max(0.28, padY - 0.015) * 100) / 100;
        ({ rem, minW } = titleMetrics());
        gapPx = gap * rem;
        cellW = (avail - (cols - 1) * gapPx) / cols;
      }
    }

    applyVars();
  }

  function render(data) {
    const root = document.getElementById('extras-root');
    const vehicles = Array.isArray(data?.vehicles) ? data.vehicles : [];
    const anyExtras = vehicles.some((v) => Array.isArray(v.extras) && v.extras.length);

    if (!vehicles.length || (data?.placeholder && !anyExtras)) {
      showGlobalPlaceholder(data?.message || 'Extras list coming soon');
      return;
    }

    root.innerHTML = vehicles.map((v) => {
      const extras = Array.isArray(v.extras) ? v.extras : [];
      const gridHtml = extras.length
        ? ('<div class="extras-grid">' + extras.map((e) => {
            const price = formatPrice(e.price, e.unit);
            const desc = String(e.description || '').trim();
            return (
              '<button type="button" class="extra-tile" aria-expanded="false"' +
                ' data-name="' + escapeHtml(e.name || '') + '"' +
                ' data-price="' + escapeHtml(price) + '"' +
                ' data-desc="' + encodeURIComponent(desc) + '">' +
                '<span class="extra-name">' + escapeHtml(e.name || '') + '</span>' +
                '<span class="extra-price">' + escapeHtml(price) + '</span>' +
              '</button>'
            );
          }).join('') + '</div>')
        : '<p class="empty-extras">No extras listed for this vehicle yet.</p>';
      const note = v.extrasNote
        ? ('<p class="extras-note">' + escapeHtml(v.extrasNote) + '</p>')
        : '';
      return (
        '<article class="vehicle-extras">' +
          '<header class="vehicle-head">' +
            '<img class="vehicle-photo" src="' + escapeHtml(v.photo || ('images/' + v.listingId + '_1.jpg')) + '" alt="' + escapeHtml(v.name || '') + '" loading="lazy">' +
            '<div>' +
              '<h2 class="vehicle-name">' + escapeHtml(v.name || '') + '</h2>' +
              '<p class="vehicle-model">' + escapeHtml(v.model || '') + '</p>' +
            '</div>' +
          '</header>' +
          note +
          gridHtml +
        '</article>'
      );
    }).join('');

    const runSize = function() { sizeExtraTiles(); };
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(runSize).catch(runSize);
    } else {
      runSize();
    }
    requestAnimationFrame(runSize);
  }

  document.getElementById('extras-root').addEventListener('click', function(e) {
    const tile = e.target.closest('.extra-tile');
    if (!tile) return;
    openDetail(tile);
  });

  let resizeTimer = 0;
  function onViewportChange() {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function() {
      document.querySelectorAll('.vehicle-extras').forEach(closeOpenInCar);
      sizeExtraTiles();
    }, 100);
  }
  window.addEventListener('resize', onViewportChange);
  window.addEventListener('orientationchange', onViewportChange);

  fetch('extras.json', { cache: 'no-store' })
    .then((res) => (res.ok ? res.json() : null))
    .then((data) => {
      if (!data) showGlobalPlaceholder();
      else render(data);
    })
    .catch(() => showGlobalPlaceholder());
})();
</script>
</body>
</html>
