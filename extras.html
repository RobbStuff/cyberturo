<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CyberTuro — Our Extras</title>
<meta name="description" content="Optional extras available with the CyberTuro Tesla fleet on Turo.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg0:#050705;
    --bg1:#080b08;
    --text:#e8ffe8;
    --muted:#8aa88a;
    --neon:#39ff14;
    --cyan:#00e5ff;
    --radius:18px;
    --site-header-h:2.75rem;
  }
  * { box-sizing:border-box; }
  html { scroll-behavior:smooth; }
  body {
    margin:0;
    font-family: Rajdhani, "Segoe UI", system-ui, -apple-system, sans-serif;
    color:var(--text);
    background-color:var(--bg0);
    background-image:
      linear-gradient(rgba(57,255,20,.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(57,255,20,.03) 1px, transparent 1px),
      repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,.12) 3px),
      radial-gradient(900px 500px at 15% -10%, rgba(57,255,20,.12), transparent 55%),
      radial-gradient(700px 400px at 100% 0%, rgba(0,229,255,.08), transparent 50%),
      linear-gradient(180deg, var(--bg0), var(--bg1) 50%, #040604);
    background-size:48px 48px, 48px 48px, 100% 4px, auto, auto, auto;
    min-height:100vh;
  }
  .site-header {
    position:fixed;
    top:0;
    left:0;
    right:0;
    z-index:300;
    height:var(--site-header-h);
    display:flex;
    align-items:center;
    box-sizing:border-box;
    padding:0 1rem;
    background:var(--bg0);
    border-bottom:1px solid rgba(57,255,20,.12);
  }
  .wrap {
    width:min(900px, calc(100% - 2rem));
    margin:0 auto;
    padding:var(--site-header-h) 0 4rem;
    position:relative;
    z-index:1;
  }
  .hero {
    text-align:center;
    padding:0 1.2rem 1.8rem;
    position:relative;
  }
  .top-nav {
    display:flex;
    flex-wrap:nowrap;
    align-items:center;
    justify-content:space-between;
    gap:0;
    width:100%;
    margin:0;
    padding:0;
    white-space:nowrap;
    font-family: Orbitron, Rajdhani, sans-serif;
    font-size:clamp(.72rem, 2.4vw, .88rem);
    font-weight:700;
    letter-spacing:.06em;
    text-transform:none;
    color:#ff8c1a;
    line-height:1.4;
  }
  .top-nav a {
    color:#ff8c1a;
    text-decoration:none;
    white-space:nowrap;
    font-weight:700;
    transition:color .2s ease, text-shadow .2s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .top-nav a:hover,
  .top-nav a:focus-visible {
    color:#ffb35a;
    text-shadow:0 0 10px rgba(255,140,26,.55);
    outline:none;
  }
  .top-nav a:focus-visible {
    outline:2px solid #ff8c1a;
    outline-offset:2px;
  }
  .top-nav .dot {
    color:#ff8c1a;
    font-weight:700;
    white-space:pre;
  }
  .brand {
    display:block;
    width:100%;
    box-sizing:border-box;
    font-family: Orbitron, Rajdhani, "Segoe UI", sans-serif;
    font-weight:800;
    font-size:clamp(2rem, 6.4vw, 3.6rem);
    letter-spacing:clamp(.04em, 1.4vw, .16em);
    text-transform:uppercase;
    text-align:center;
    color:var(--neon);
    text-shadow:0 0 10px rgba(57,255,20,.7), 0 0 30px rgba(57,255,20,.35);
    margin:0 0 .9rem;
    line-height:1.1;
    overflow-wrap:normal;
    text-decoration:none;
  }
  .brand:hover,
  .brand:focus-visible { color:#f0fff0; outline:none; }
  h1 {
    display:block;
    width:100%;
    margin:0 auto .85rem;
    font-family: Orbitron, Rajdhani, "Segoe UI", sans-serif;
    font-size:clamp(1.2rem, 3.6vw, 2.05rem);
    line-height:1.2;
    letter-spacing:.04em;
    padding-left:.04em;
    font-weight:800;
    text-align:center;
    color:#f0fff0;
    text-shadow:0 0 8px rgba(57,255,20,.55), 0 0 24px rgba(57,255,20,.25), 0 0 2px rgba(0,229,255,.35);
  }
  .back-link {
    display:inline-block;
    margin:0 auto 1.6rem;
    color:var(--cyan);
    text-decoration:none;
    font-family: Orbitron, Rajdhani, sans-serif;
    font-size:.8rem;
    letter-spacing:.08em;
    text-transform:uppercase;
    text-shadow:0 0 8px rgba(0,229,255,.35);
  }
  .back-link:hover,
  .back-link:focus-visible { color:var(--neon); outline:none; }
  .hero-links { text-align:center; }
  .fleet-extras {
    display:flex;
    flex-direction:column;
    gap:1.35rem;
  }
  .vehicle-extras {
    display:grid;
    grid-template-columns:132px 1fr;
    gap:1rem;
    padding:1rem;
    border-radius:var(--radius);
    border:1px solid rgba(57,255,20,.28);
    background:linear-gradient(180deg, rgba(57,255,20,.05), rgba(0,0,0,.28));
    box-shadow:0 0 18px rgba(57,255,20,.08);
  }
  @media (max-width:560px) {
    .vehicle-extras { grid-template-columns:1fr; }
  }
  .vehicle-photo {
    width:100%;
    aspect-ratio:4/3;
    object-fit:cover;
    border-radius:12px;
    border:1px solid rgba(57,255,20,.25);
    background:#030503;
  }
  .vehicle-name {
    margin:0;
    font-family: Orbitron, Rajdhani, sans-serif;
    font-size:clamp(1.25rem, 2.8vw, 1.55rem);
    font-weight:800;
    letter-spacing:.04em;
    color:#f5fff5;
    text-shadow:0 0 8px rgba(57,255,20,.35);
  }
  .vehicle-model {
    margin:.15rem 0 .7rem;
    font-family: Orbitron, Rajdhani, sans-serif;
    font-size:.9rem;
    font-weight:600;
    letter-spacing:.03em;
    color:var(--muted);
  }
  .extras-note {
    margin:0 0 .55rem;
    font-size:.88rem;
    color:var(--cyan);
  }
  .extras-list {
    list-style:none;
    margin:0;
    padding:0;
    display:flex;
    flex-direction:column;
    gap:.55rem;
  }
  .extras-list li {
    padding:.55rem .7rem;
    border-radius:10px;
    border:1px solid rgba(57,255,20,.16);
    background:rgba(57,255,20,.04);
  }
  .extra-top {
    display:flex;
    flex-wrap:wrap;
    gap:.35rem .75rem;
    align-items:center;
    justify-content:space-between;
  }
  .extra-label {
    display:inline-flex;
    align-items:center;
    gap:.45rem;
    min-width:0;
  }
  .extra-icon {
    flex:0 0 auto;
    width:1.15rem;
    height:1.15rem;
    color:var(--neon);
    filter:drop-shadow(0 0 6px rgba(57,255,20,.45));
  }
  .extra-icon svg {
    display:block;
    width:100%;
    height:100%;
  }
  .extra-name {
    font-weight:700;
    font-size:1.02rem;
    color:#efffef;
  }
  .extra-price {
    font-family: Orbitron, Rajdhani, sans-serif;
    font-size:.82rem;
    letter-spacing:.04em;
    color:var(--neon);
  }
  .extra-desc {
    margin:.25rem 0 0;
    color:var(--muted);
    font-size:.95rem;
    line-height:1.35;
  }
  .placeholder {
    text-align:center;
    padding:2.4rem 1.2rem;
    border-radius:var(--radius);
    border:1px dashed rgba(57,255,20,.35);
    background:rgba(57,255,20,.04);
  }
  .placeholder h2 {
    margin:0 0 .55rem;
    font-family: Orbitron, Rajdhani, sans-serif;
    font-size:1.15rem;
    letter-spacing:.06em;
    color:var(--neon);
  }
  .placeholder p {
    margin:0;
    color:var(--muted);
    font-size:1.05rem;
  }
  .empty-extras {
    margin:0;
    color:var(--muted);
    font-size:.95rem;
  }
  footer { text-align:center; color:var(--muted); margin-top:2.5rem; font-size:.95rem; }
  footer a { color:var(--cyan); text-shadow:0 0 8px rgba(0,229,255,.35); }
</style>
</head>
<body>
  <header class="site-header">
    <nav class="top-nav" aria-label="Site">
      <a href="index.html">Fleet</a><span class="dot" aria-hidden="true">.</span><a href="reviews.html">Reviews</a><span class="dot" aria-hidden="true">.</span><a href="extras.html">Extras</a><span class="dot" aria-hidden="true">.</span><a href="#" id="login-link">Login</a>
    </nav>
  </header>
  <div class="wrap">
    <header class="hero">
      <a class="brand" href="index.html">CyberTuro</a>
      <h1>Our Extras</h1>
      <div class="hero-links">
        <a class="back-link" href="index.html">← Back to our fleet</a>
      </div>
    </header>

    <main id="extras-root" class="fleet-extras" aria-live="polite">
      <div class="placeholder">
        <h2>Loading extras…</h2>
        <p>Checking each vehicle’s public Turo listing.</p>
      </div>
    </main>

    <footer>
      <a href="index.html">Fleet</a> ·
      <a href="reviews.html">Our Reviews</a> ·
      <a href="https://turo.com/host/16034992" target="_blank" rel="noopener">Turo host profile</a>
    </footer>
  </div>
<script>
(function() {

  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function formatPrice(price, unit) {
    if (price == null || price === '') return '';
    const n = Number(price);
    const money = Number.isFinite(n) ? ('$' + n.toFixed(n % 1 ? 2 : 0)) : String(price);
    return money + (unit ? (' ' + unit) : '');
  }

  // Extensible keyword → icon key mapping (first match wins; add rows as needed).
  const EXTRA_ICON_RULES = [
    { keys: ['charging', 'ev', 'supercharge', 'supercharger'], icon: 'bolt' },
    { keys: ['toll', 'road'], icon: 'toll' },
    { keys: ['cooler'], icon: 'cooler' },
    { keys: ['beach', 'umbrella', 'chair'], icon: 'umbrella' },
    { keys: ['stroller', 'child', 'car seat', 'carseat'], icon: 'baby' },
    { keys: ['pet'], icon: 'paw' },
    { keys: ['prepaid', 'refuel', 'clean'], icon: 'sparkle' },
    { keys: ['delivery', 'airport'], icon: 'plane' },
    { keys: ['unlimited miles', 'unlimited'], icon: 'infinity' },
    { keys: ['phone', 'charger', 'cable'], icon: 'plug' },
    { keys: ['camping'], icon: 'tent' },
  ];

  const EXTRA_ICONS = {
    bolt: '<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 4 14h7l-1 8 10-13h-7l1-7z"/></svg>',
    toll: '<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h18"/><path d="M5 9v6"/><path d="M19 9v6"/><path d="M9 10.5c.8-.8 1.7-1.2 3-1.2s2.2.4 3 1.2"/><path d="M9 13.5c.8.8 1.7 1.2 3 1.2s2.2-.4 3-1.2"/></svg>',
    cooler: '<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="7" width="16" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M4 12h16"/></svg>',
    umbrella: '<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c-5 0-9 3-9 7h18c0-4-4-7-9-7z"/><path d="M12 10v9a2 2 0 0 0 4 0"/></svg>',
    baby: '<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="7" r="3"/><path d="M7 21v-2a5 5 0 0 1 10 0v2"/><path d="M5 14h14"/></svg>',
    paw: '<svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><circle cx="5.5" cy="9" r="2"/><circle cx="18.5" cy="9" r="2"/><circle cx="8" cy="5" r="2"/><circle cx="16" cy="5" r="2"/><path d="M12 13c-2.8 0-5 2-5 4.4 0 1.6 1.4 2.6 3.2 2.6.9 0 1.5-.3 1.8-.3s.9.3 1.8.3c1.8 0 3.2-1 3.2-2.6 0-2.4-2.2-4.4-5-4.4z"/></svg>',
    sparkle: '<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v4"/><path d="M12 17v4"/><path d="M3 12h4"/><path d="M17 12h4"/><path d="m6 6 2.5 2.5"/><path d="m15.5 15.5 2.5 2.5"/><path d="m18 6-2.5 2.5"/><path d="m8.5 15.5-2.5 2.5"/></svg>',
    plane: '<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 15 3.5 17.5 5 13l9-4.5L21 3l-2 9.5L14 19l-1.5-3.5"/><path d="m14 19 1 3"/></svg>',
    infinity: '<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 12c0-2.2 1.8-4 4-2.5 1.3.9 1.7 2 2.5 2.5 2.2 1.5 4-.3 4-2.5s-1.8-4-4-2.5c-.8.5-1.2 1.6-2.5 2.5C8.8 16 7 14.2 7 12z"/></svg>',
    plug: '<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 7v5"/><path d="M15 7v5"/><path d="M7 12h10"/><path d="M12 12v7"/><path d="M9 21h6"/></svg>',
    tent: '<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 4 9 16H3L12 4z"/><path d="M12 4v16"/></svg>',
    // fallback tag/star
    tag: '<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 3 12l9 9 9-9-9-9z"/><path d="m12 3 3 3"/><circle cx="8.5" cy="8.5" r="1"/></svg>'
  };

  function iconForExtraName(name) {
    const hay = String(name || '').toLowerCase();
    for (const rule of EXTRA_ICON_RULES) {
      if (rule.keys.some((k) => hay.includes(k))) return rule.icon;
    }
    return 'tag';
  }

  function extraIconHtml(name) {
    const key = iconForExtraName(name);
    const svg = EXTRA_ICONS[key] || EXTRA_ICONS.tag;
    return '<span class="extra-icon" title="' + escapeHtml(key) + '">' + svg + '</span>';
  }

  function showGlobalPlaceholder(message) {
    document.getElementById('extras-root').innerHTML =
      '<div class="placeholder">' +
        '<h2>Extras list coming soon</h2>' +
        '<p>' + escapeHtml(message || 'Optional extras from each public Turo listing will appear here once available.') + '</p>' +
      '</div>';
  }

  function render(data) {
    const root = document.getElementById('extras-root');
    const vehicles = Array.isArray(data?.vehicles) ? data.vehicles : [];
    const anyExtras = vehicles.some((v) => Array.isArray(v.extras) && v.extras.length);

    if (!vehicles.length || (data?.placeholder && !anyExtras)) {
      showGlobalPlaceholder(data?.message || 'Extras list coming soon');
      return;
    }

    root.innerHTML = vehicles.map((v) => {
      const extras = Array.isArray(v.extras) ? v.extras : [];
      const listHtml = extras.length
        ? ('<ul class="extras-list">' + extras.map((e) => (
            '<li>' +
              '<div class="extra-top">' +
                '<span class="extra-label">' +
                  extraIconHtml(e.name) +
                  '<span class="extra-name">' + escapeHtml(e.name || '') + '</span>' +
                '</span>' +
                '<span class="extra-price">' + escapeHtml(formatPrice(e.price, e.unit)) + '</span>' +
              '</div>' +
              (e.description ? ('<p class="extra-desc">' + escapeHtml(e.description) + '</p>') : '') +
            '</li>'
          )).join('') + '</ul>')
        : '<p class="empty-extras">No extras listed for this vehicle yet.</p>';
      const note = v.extrasNote
        ? ('<p class="extras-note">' + escapeHtml(v.extrasNote) + '</p>')
        : '';
      return (
        '<article class="vehicle-extras">' +
          '<img class="vehicle-photo" src="' + escapeHtml(v.photo || ('images/' + v.listingId + '_1.jpg')) + '" alt="' + escapeHtml(v.name || '') + '" loading="lazy">' +
          '<div>' +
            '<h2 class="vehicle-name">“' + escapeHtml(v.name || '') + '”</h2>' +
            '<p class="vehicle-model">' + escapeHtml(v.model || '') + '</p>' +
            note +
            listHtml +
          '</div>' +
        '</article>'
      );
    }).join('');
  }

  fetch('extras.json', { cache: 'no-store' })
    .then((res) => (res.ok ? res.json() : null))
    .then((data) => {
      if (!data) showGlobalPlaceholder();
      else render(data);
    })
    .catch(() => showGlobalPlaceholder());
})();
</script>
</body>
</html>
