<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache">
<title>CyberTuro — Our Reviews</title>
<meta name="description" content="CyberTuro guest reviews for our Tesla Cybertruck and Model Y fleet.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg0:#050705;
    --bg1:#080b08;
    --text:#e8ffe8;
    --muted:#8aa88a;
    --neon:#39ff14;
    --cyan:#00e5ff;
    --radius:18px;
    --site-header-h:2.75rem;
    --fleet-note-size:clamp(.875rem, 2.8vw, 1rem);
    /* Matches measured CyberTuro→NEW visible gap (brand mb .9rem + note vertical centering) */
    --brand-stack-gap:calc(.9rem + (2.6rem - 1.4 * var(--fleet-note-size)) / 2 + .14rem);
    --site-header-offset:calc(var(--site-header-h) + env(safe-area-inset-top, 0px));
  }
  * { box-sizing:border-box; }
  html {
    scroll-behavior:smooth;
  }
  body {
    margin:0;
    font-family: Rajdhani, "Segoe UI", system-ui, -apple-system, sans-serif;
    color:var(--text);
    background-color:var(--bg0);
    background-image:
      linear-gradient(rgba(57,255,20,.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(57,255,20,.03) 1px, transparent 1px),
      repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,.12) 3px),
      radial-gradient(900px 500px at 15% -10%, rgba(57,255,20,.12), transparent 55%),
      radial-gradient(700px 400px at 100% 0%, rgba(0,229,255,.08), transparent 50%),
      linear-gradient(180deg, var(--bg0), var(--bg1) 50%, #040604);
    background-size:48px 48px, 48px 48px, 100% 4px, auto, auto, auto;
    min-height:100vh;
  }
  .site-header {
    position:fixed;
    top:0;
    left:0;
    right:0;
    z-index:500;
    height:var(--site-header-offset);
    display:flex;
    align-items:center;
    box-sizing:border-box;
    padding:env(safe-area-inset-top, 0px) 1rem 0;
    background:#050705;
    border-bottom:1px solid rgba(57,255,20,.12);
    transform:none;
    -webkit-transform:none;
  }
  .wrap {
    width:min(900px, calc(100% - 2rem));
    margin:0 auto;
    padding:var(--site-header-offset) 0 4rem;
    position:relative;
    z-index:1;
  }
  .hero {
    text-align:center;
    padding:0 1.2rem 1.8rem;
    position:relative;
  }
  .top-nav {
    display:flex;
    flex-wrap:nowrap;
    align-items:center;
    justify-content:space-between;
    gap:0;
    width:100%;
    margin:0;
    padding:0;
    white-space:nowrap;
    font-family: Orbitron, Rajdhani, sans-serif;
    font-size:clamp(.72rem, 2.4vw, .88rem);
    font-weight:700;
    letter-spacing:.06em;
    text-transform:none;
    color:#ff8c1a;
    line-height:1.4;
  }
  .top-nav a {
    color:#ff8c1a;
    text-decoration:none;
    white-space:nowrap;
    font-weight:700;
    transition:color .2s ease, text-shadow .2s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .top-nav a:hover,
  .top-nav a:focus-visible {
    color:#ffb35a;
    text-shadow:0 0 10px rgba(255,140,26,.55);
    outline:none;
  }
  .top-nav a:focus-visible {
    outline:2px solid #ff8c1a;
    outline-offset:2px;
  }
  .top-nav .dot {
    color:#ff8c1a;
    font-weight:700;
    white-space:pre;
  }
  .brand {
    display:block;
    width:100%;
    box-sizing:border-box;
    font-family: Orbitron, Rajdhani, "Segoe UI", sans-serif;
    font-weight:800;
    font-size:clamp(2rem, 6.4vw, 3.6rem);
    letter-spacing:clamp(.04em, 1.4vw, .16em);
    text-transform:uppercase;
    text-align:center;
    color:var(--neon);
    text-shadow:0 0 10px rgba(57,255,20,.7), 0 0 30px rgba(57,255,20,.35);
    margin:var(--brand-stack-gap) 0 .9rem;
    line-height:1.1;
    overflow-wrap:normal;
    text-decoration:none;
  }
  .brand:hover,
  .brand:focus-visible {
    color:#f0fff0;
    outline:none;
  }
  h1 {
    display:block;
    width:100%;
    margin:0 auto .85rem;
    font-family: Orbitron, Rajdhani, "Segoe UI", sans-serif;
    font-size:clamp(1.2rem, 3.6vw, 2.05rem);
    line-height:1.2;
    letter-spacing:.04em;
    padding-left:.04em;
    font-weight:800;
    text-align:center;
    color:#f0fff0;
    text-shadow:0 0 8px rgba(57,255,20,.55), 0 0 24px rgba(57,255,20,.25), 0 0 2px rgba(0,229,255,.35);
  }
  .back-link {
    display:inline-flex;
    align-items:center;
    gap:.28rem;
    margin:0 0 .55rem;
    color:var(--neon);
    text-decoration:none;
    font-family: Orbitron, Rajdhani, sans-serif;
    font-size:.8rem;
    font-weight:700;
    letter-spacing:.08em;
    text-transform:uppercase;
    line-height:1.2;
    -webkit-tap-highlight-color: transparent;
  }
  .back-link:hover,
  .back-link:focus-visible {
    color:#b8ff7a;
    outline:none;
  }
  .back-link:focus-visible {
    outline:2px solid var(--neon);
    outline-offset:2px;
  }
  .reviews {
    display:grid;
    grid-template-columns:minmax(0, 1fr);
    gap:1rem;
    align-items:stretch;
  }
  @media (min-width:768px) {
    .reviews {
      grid-template-columns:repeat(2, minmax(0, 1fr));
    }
  }
  .reviews > .placeholder {
    grid-column:1 / -1;
  }
  .review {
    display:grid;
    grid-template-columns:68px minmax(0, 1fr);
    gap:.85rem;
    align-items:start;
    padding:1rem;
    border-radius:var(--radius);
    border:1px solid rgba(57,255,20,.28);
    background:linear-gradient(180deg, rgba(57,255,20,.05), rgba(0,0,0,.28));
    box-shadow:0 0 18px rgba(57,255,20,.08);
    min-width:0;
    box-sizing:border-box;
  }
  .review-body {
    display:flex;
    flex-direction:column;
    min-width:0;
    min-height:100%;
  }
  .review-media {
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:.25rem;
    width:68px;
  }
  .review-photo {
    width:68px;
    height:68px;
    object-fit:cover;
    border-radius:10px;
    border:1px solid rgba(57,255,20,.25);
    background:#030503;
    flex-shrink:0;
  }
  .review-stars {
    display:block;
    width:68px;
    margin:0;
    padding:0;
    text-align:center;
    font-size:.62rem;
    letter-spacing:.02em;
    line-height:1.1;
    color:#ffd54a;
    text-shadow:0 0 8px rgba(255,213,74,.35);
  }
  .review-meta {
    display:flex;
    flex-wrap:wrap;
    gap:.35rem .7rem;
    align-items:baseline;
    margin:0 0 .45rem;
    color:var(--muted);
    font-size:.92rem;
  }
  .review-vehicle {
    font-family: Orbitron, Rajdhani, sans-serif;
    font-weight:700;
    letter-spacing:.04em;
    color:var(--neon);
    text-shadow:0 0 8px rgba(57,255,20,.35);
  }
  .review-text {
    margin:0;
    font-size:1.08rem;
    line-height:1.45;
    color:#efffef;
  }
  .review-credit {
    font-size:.92em;
    color:var(--muted);
  }
  .review-attribution {
    font-style:italic;
    color:var(--muted);
  }
  .review-date {
    font-style:normal;
    color:var(--muted);
  }
  .review-more {
    display:inline;
    margin:0;
    padding:0;
    border:0;
    background:none;
    color:var(--cyan);
    font:inherit;
    font-weight:600;
    letter-spacing:.02em;
    cursor:pointer;
    text-decoration:none;
    -webkit-tap-highlight-color: transparent;
  }
  .review-more:hover,
  .review-more:focus-visible {
    color:var(--neon);
    outline:none;
  }
  .placeholder {
    text-align:center;
    padding:2.4rem 1.2rem;
    border-radius:var(--radius);
    border:1px dashed rgba(57,255,20,.35);
    background:rgba(57,255,20,.04);
  }
  .placeholder h2 {
    margin:0 0 .55rem;
    font-family: Orbitron, Rajdhani, sans-serif;
    font-size:1.15rem;
    letter-spacing:.06em;
    color:var(--neon);
  }
  .placeholder p {
    margin:0;
    color:var(--muted);
    font-size:1.05rem;
  }
  footer { text-align:center; color:var(--muted); margin-top:2.5rem; font-size:.95rem; }
  footer a { color:var(--cyan); text-shadow:0 0 8px rgba(0,229,255,.35); }
</style>
</head>
<body>
  <header class="site-header">
    <nav class="top-nav" aria-label="Site">
      <a href="index.html">Fleet</a><span class="dot" aria-hidden="true">.</span><a href="reviews.html">Reviews</a><span class="dot" aria-hidden="true">.</span><a href="extras.html">Extras</a><span class="dot" aria-hidden="true">.</span><a href="#" id="login-link">Login</a>
    </nav>
  </header>
  <div class="wrap">
    <header class="hero">
      <a class="brand" href="index.html">CyberTuro</a>
      <h1>Our Reviews</h1>
    </header>

    <a class="back-link" href="index.html" aria-label="Back to our fleet">‹ Back</a>

    <main id="reviews" class="reviews" aria-live="polite">
      <div class="placeholder" id="reviews-loading">
        <h2>Loading reviews…</h2>
        <p>Pulling the latest five-star guest feedback.</p>
      </div>
    </main>

    <footer>
      <a href="index.html">Fleet</a> ·
      <a href="extras.html">Our Extras</a> ·
      <a href="https://turo.com/host/16034992" target="_blank" rel="noopener">Turo host profile</a>
    </footer>
  </div>
<script>
(function() {
  document.querySelector('.back-link')?.addEventListener('click', function(e) {
    e.preventDefault();
    let sameSite = false;
    try {
      if (document.referrer) sameSite = new URL(document.referrer).origin === location.origin;
    } catch (_) {}
    if (sameSite) { history.back(); return; }
    location.href = 'index.html';
  });

  const NAMES = {
    "2587824": "Merlin",
    "2740306": "Maverick",
    "3307368": "Casper",
    "3307383": "Storm",
    "3307398": "Ruby",
    "3307415": "Rooster",
    "3506536": "Frosty",
    "3531702": "Goose",
    "3563398": "Blaze",
    "3595182": "Yeti",
    "3619928": "Bandit",
    "3943006": "Cosmo",
    "3959789": "Bubba"
  };


  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function formatDate(value) {
    if (!value) return '';
    const s = String(value).trim();
    // Prefer M/D/YYYY from YYYY-MM-DD without timezone shift.
    const iso = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
    if (iso) return Number(iso[2]) + '/' + Number(iso[3]) + '/' + iso[1];
    const d = new Date(s);
    if (Number.isNaN(d.getTime())) return s;
    return (d.getMonth() + 1) + '/' + d.getDate() + '/' + d.getFullYear();
  }

  function showPlaceholder() {
    const root = document.getElementById('reviews');
    root.innerHTML =
      '<div class="placeholder">' +
        '<h2>Reviews coming soon</h2>' +
        '<p>Five-star guest reviews will appear here once public Turo feedback is available.</p>' +
      '</div>';
  }

  function wordsOf(text) {
    return String(text || '').trim().split(/\s+/).filter(Boolean);
  }

  function isTouchTablet() {
    // iPadOS 13+ may report as Mac; treat multi-touch / coarse pointer as tablet.
    const multiTouch = (navigator.maxTouchPoints || 0) > 1;
    const coarse = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
    return multiTouch || !!coarse;
  }

  function wordLimit() {
    const w = window.innerWidth;
    if (w < 768) return 12; // phone
    // Touch tablets (incl. large iPad landscape up to ~1366): 20 words.
    if (isTouchTablet() && w <= 1366) return 20;
    // Non-touch desktop (and anything wider): 40.
    return 40;
  }

  function equalizeCollapsedHeights() {
    const cards = [...document.querySelectorAll('#reviews .review')];
    if (!cards.length) return;
    // Clear prior min-heights so natural collapsed heights can be measured.
    cards.forEach((card) => {
      card.style.minHeight = '';
    });
    // Measure only collapsed cards (expanded cards may grow taller).
    let maxH = 0;
    cards.forEach((card) => {
      const text = card.querySelector('.review-text');
      if (text && text.getAttribute('data-expanded') === 'true') return;
      maxH = Math.max(maxH, card.getBoundingClientRect().height);
    });
    if (maxH < 1) return;
    const shared = Math.ceil(maxH) + 'px';
    cards.forEach((card) => {
      const text = card.querySelector('.review-text');
      if (text && text.getAttribute('data-expanded') === 'true') return;
      card.style.minHeight = shared;
    });
  }

  function reviewTextHtml(fullText, firstName, when) {
    const full = String(fullText || '').trim();
    let credit = '';
    if (firstName || when) {
      credit = ' <span class="review-credit">';
      if (firstName) credit += '<span class="review-attribution">— ' + escapeHtml(firstName) + '</span>';
      if (when) credit += (firstName ? ' ' : '') + '<span class="review-date">' + escapeHtml(when) + '</span>';
      credit += '</span>';
    }
    return (
      '<p class="review-text" data-full="' + encodeURIComponent(full) + '" data-expanded="false">' +
        '“<span class="review-text-body"></span><span class="review-toggle"> <button type="button" class="review-more" aria-expanded="false">more</button></span>”' +
        credit +
      '</p>'
    );
  }

  function applyTruncation(el) {
    if (!el || el.getAttribute('data-expanded') === 'true') return;
    const full = decodeURIComponent(el.getAttribute('data-full') || '');
    const body = el.querySelector('.review-text-body');
    const toggle = el.querySelector('.review-toggle');
    const btn = el.querySelector('.review-more');
    if (!body) return;
    const words = wordsOf(full);
    const limit = wordLimit();
    if (words.length <= limit) {
      body.textContent = full;
      if (toggle) toggle.hidden = true;
      if (btn) {
        btn.setAttribute('aria-expanded', 'false');
        btn.textContent = 'more';
      }
      return;
    }
    body.textContent = words.slice(0, limit).join(' ') + '…';
    if (toggle) toggle.hidden = false;
    if (btn) {
      btn.setAttribute('aria-expanded', 'false');
      btn.textContent = 'more';
    }
  }

  function applyAllTruncations(opts) {
    const forceCollapse = !!(opts && opts.forceCollapse);
    document.querySelectorAll('#reviews .review-text[data-full]').forEach((el) => {
      if (forceCollapse) {
        el.setAttribute('data-expanded', 'false');
        const btn = el.querySelector('.review-more');
        if (btn) {
          btn.setAttribute('aria-expanded', 'false');
          btn.textContent = 'more';
        }
      }
      applyTruncation(el);
    });
    equalizeCollapsedHeights();
  }

  function render(reviews) {
    const root = document.getElementById('reviews');
    const fiveStar = (Array.isArray(reviews) ? reviews : [])
      .filter((r) => Number(r.rating ?? r.stars) === 5 && r.text)
      .sort((a, b) => new Date(b.date) - new Date(a.date));

    if (!fiveStar.length) {
      showPlaceholder();
      return;
    }

    root.innerHTML = fiveStar.map((r) => {
      const id = String(r.listingId || '');
      const name = NAMES[id] || r.vehicleName || 'Fleet vehicle';
      const img = r.photo || (id ? ('images/' + id + '_1.jpg') : '');
      const who = r.reviewerFirstName || r.reviewer || 'Guest';
      const firstName = String(r.reviewerFirstName || '').trim();
      const when = formatDate(r.date);
      return (
        '<article class="review">' +
          '<div class="review-media">' +
            (img
              ? '<img class="review-photo" src="' + escapeHtml(img) + '" alt="' + escapeHtml(name) + '" loading="lazy">'
              : '<div class="review-photo" aria-hidden="true"></div>') +
            '<div class="review-stars" aria-label="5 out of 5 stars">★★★★★</div>' +
          '</div>' +
          '<div class="review-body">' +
            '<div class="review-meta">' +
              '<span class="review-vehicle">' + escapeHtml(name) + '</span>' +
              '<span>' + escapeHtml(who) + '</span>' +
            '</div>' +
            reviewTextHtml(r.text, firstName, when) +
          '</div>' +
        '</article>'
      );
    }).join('');
    applyAllTruncations();
    requestAnimationFrame(equalizeCollapsedHeights);
  }

  document.getElementById('reviews').addEventListener('click', function(e) {
    const btn = e.target.closest('.review-more');
    if (!btn) return;
    const wrap = btn.closest('.review-text');
    if (!wrap) return;
    const card = wrap.closest('.review');
    const body = wrap.querySelector('.review-text-body');
    const toggle = wrap.querySelector('.review-toggle');
    const expanded = wrap.getAttribute('data-expanded') === 'true';
    if (expanded) {
      wrap.setAttribute('data-expanded', 'false');
      applyTruncation(wrap);
      // Restore shared collapsed height for this card.
      equalizeCollapsedHeights();
    } else {
      // Expanding: clear this card's min-height so it can grow; others keep shared height.
      if (card) card.style.minHeight = '';
      body.textContent = decodeURIComponent(wrap.getAttribute('data-full') || '');
      wrap.setAttribute('data-expanded', 'true');
      if (toggle) toggle.hidden = false;
      btn.setAttribute('aria-expanded', 'true');
      btn.textContent = 'less';
    }
  });

  let resizeTimer = 0;
  function onViewportChange() {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function() {
      // Re-measure limit after rotate/resize (collapse so word count updates).
      applyAllTruncations({ forceCollapse: true });
    }, 100);
  }
  window.addEventListener('resize', onViewportChange);
  window.addEventListener('orientationchange', onViewportChange);
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', onViewportChange);
  }

  fetch('reviews.json?v=' + Date.now(), { cache: 'no-store' })
    .then((res) => (res.ok ? res.json() : []))
    .then(render)
    .catch(showPlaceholder);
})();
</script>
</body>
</html>
