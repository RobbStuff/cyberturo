<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CyberTuro — Our Reviews</title>
<meta name="description" content="CyberTuro guest reviews for our Tesla Cybertruck and Model Y fleet.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg0:#050705;
    --bg1:#080b08;
    --text:#e8ffe8;
    --muted:#8aa88a;
    --neon:#39ff14;
    --cyan:#00e5ff;
    --radius:18px;
  }
  * { box-sizing:border-box; }
  html { scroll-behavior:smooth; }
  body {
    margin:0;
    font-family: Rajdhani, "Segoe UI", system-ui, -apple-system, sans-serif;
    color:var(--text);
    background-color:var(--bg0);
    background-image:
      linear-gradient(rgba(57,255,20,.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(57,255,20,.03) 1px, transparent 1px),
      repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,.12) 3px),
      radial-gradient(900px 500px at 15% -10%, rgba(57,255,20,.12), transparent 55%),
      radial-gradient(700px 400px at 100% 0%, rgba(0,229,255,.08), transparent 50%),
      linear-gradient(180deg, var(--bg0), var(--bg1) 50%, #040604);
    background-size:48px 48px, 48px 48px, 100% 4px, auto, auto, auto;
    min-height:100vh;
  }
  .wrap {
    width:min(900px, calc(100% - 2rem));
    margin:0 auto;
    padding:2.5rem 0 4rem;
    position:relative;
    z-index:1;
  }
  .hero {
    text-align:center;
    padding:1.4rem 1.2rem 1.8rem;
    position:relative;
  }
  .top-nav {
    display:flex;
    flex-wrap:nowrap;
    align-items:center;
    justify-content:center;
    gap:0;
    width:100%;
    margin:0 0 .95rem;
    padding:0;
    white-space:nowrap;
    font-family: Orbitron, Rajdhani, sans-serif;
    font-size:clamp(.72rem, 2.4vw, .88rem);
    font-weight:600;
    letter-spacing:.06em;
    text-transform:none;
    color:var(--muted);
    line-height:1.4;
  }
  .top-nav a {
    color:var(--neon);
    text-decoration:none;
    white-space:nowrap;
    transition:color .2s ease, text-shadow .2s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .top-nav a:hover,
  .top-nav a:focus-visible {
    color:#f0fff0;
    text-shadow:0 0 10px rgba(57,255,20,.55);
    outline:none;
  }
  .top-nav a:focus-visible {
    outline:2px solid var(--neon);
    outline-offset:2px;
  }
  .top-nav .dot {
    color:var(--muted);
    white-space:pre;
  }
  .brand {
    display:block;
    width:100%;
    box-sizing:border-box;
    font-family: Orbitron, Rajdhani, "Segoe UI", sans-serif;
    font-weight:800;
    font-size:clamp(2rem, 6.4vw, 3.6rem);
    letter-spacing:clamp(.04em, 1.4vw, .16em);
    text-transform:uppercase;
    text-align:center;
    color:var(--neon);
    text-shadow:0 0 10px rgba(57,255,20,.7), 0 0 30px rgba(57,255,20,.35);
    margin:0 0 .9rem;
    line-height:1.1;
    overflow-wrap:normal;
    text-decoration:none;
  }
  .brand:hover,
  .brand:focus-visible {
    color:#f0fff0;
    outline:none;
  }
  h1 {
    display:block;
    width:100%;
    margin:0 auto .85rem;
    font-family: Orbitron, Rajdhani, "Segoe UI", sans-serif;
    font-size:clamp(1.2rem, 3.6vw, 2.05rem);
    line-height:1.2;
    letter-spacing:.04em;
    padding-left:.04em;
    font-weight:800;
    text-align:center;
    color:#f0fff0;
    text-shadow:0 0 8px rgba(57,255,20,.55), 0 0 24px rgba(57,255,20,.25), 0 0 2px rgba(0,229,255,.35);
  }
  .back-link {
    display:inline-block;
    margin:0 auto 1.6rem;
    color:var(--cyan);
    text-decoration:none;
    font-family: Orbitron, Rajdhani, sans-serif;
    font-size:.8rem;
    letter-spacing:.08em;
    text-transform:uppercase;
    text-shadow:0 0 8px rgba(0,229,255,.35);
  }
  .back-link:hover,
  .back-link:focus-visible {
    color:var(--neon);
    outline:none;
  }
  .hero-links { text-align:center; }
  .reviews {
    display:flex;
    flex-direction:column;
    gap:1.25rem;
  }
  .review {
    display:grid;
    grid-template-columns:112px 1fr;
    gap:1rem;
    align-items:start;
    padding:1rem;
    border-radius:var(--radius);
    border:1px solid rgba(57,255,20,.28);
    background:linear-gradient(180deg, rgba(57,255,20,.05), rgba(0,0,0,.28));
    box-shadow:0 0 18px rgba(57,255,20,.08);
  }
  @media (max-width:520px) {
    .review { grid-template-columns:1fr; }
  }
  .review-photo {
    width:100%;
    aspect-ratio:4/3;
    object-fit:cover;
    border-radius:12px;
    border:1px solid rgba(57,255,20,.25);
    background:#030503;
  }
  .review-meta {
    display:flex;
    flex-wrap:wrap;
    gap:.35rem .7rem;
    align-items:baseline;
    margin:0 0 .45rem;
    color:var(--muted);
    font-size:.92rem;
  }
  .review-vehicle {
    font-family: Orbitron, Rajdhani, sans-serif;
    font-weight:700;
    letter-spacing:.04em;
    color:var(--neon);
    text-shadow:0 0 8px rgba(57,255,20,.35);
  }
  .review-text {
    margin:0;
    font-size:1.08rem;
    line-height:1.45;
    color:#efffef;
  }
  .placeholder {
    text-align:center;
    padding:2.4rem 1.2rem;
    border-radius:var(--radius);
    border:1px dashed rgba(57,255,20,.35);
    background:rgba(57,255,20,.04);
  }
  .placeholder h2 {
    margin:0 0 .55rem;
    font-family: Orbitron, Rajdhani, sans-serif;
    font-size:1.15rem;
    letter-spacing:.06em;
    color:var(--neon);
  }
  .placeholder p {
    margin:0;
    color:var(--muted);
    font-size:1.05rem;
  }
  footer { text-align:center; color:var(--muted); margin-top:2.5rem; font-size:.95rem; }
  footer a { color:var(--cyan); text-shadow:0 0 8px rgba(0,229,255,.35); }
</style>
</head>
<body>
  <div class="wrap">
    <header class="hero">
            <nav class="top-nav" aria-label="Site">
        <a href="index.html">Fleet</a><span class="dot" aria-hidden="true"> . </span><a href="reviews.html">Reviews</a><span class="dot" aria-hidden="true"> . </span><a href="extras.html">Extras</a><span class="dot" aria-hidden="true"> . </span><a href="#" id="login-link">Log In</a>
      </nav>
      <a class="brand" href="index.html">CyberTuro</a>
      </div>
      <h1>Our Reviews</h1>
      <div class="hero-links">
        <a class="back-link" href="index.html">← Back to our fleet</a>
      </div>
    </header>

    <main id="reviews" class="reviews" aria-live="polite">
      <div class="placeholder" id="reviews-loading">
        <h2>Loading reviews…</h2>
        <p>Pulling the latest five-star guest feedback.</p>
      </div>
    </main>

    <footer>
      <a href="index.html">Fleet</a> ·
      <a href="extras.html">Our Extras</a> ·
      <a href="https://turo.com/host/16034992" target="_blank" rel="noopener">Turo host profile</a>
    </footer>
  </div>
<script>
(function() {
  const NAMES = {
    "2587824": "Merlin",
    "2740306": "Maverick",
    "3307368": "Casper",
    "3307383": "Storm",
    "3307398": "Ruby",
    "3307415": "Rooster",
    "3506536": "Frosty",
    "3531702": "Goose",
    "3563398": "Blaze",
    "3595182": "Yeti",
    "3619928": "Bandit",
    "3943006": "Cosmo",
    "3959789": "Bubba"
  };


  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function formatDate(value) {
    if (!value) return '';
    const d = new Date(value);
    if (Number.isNaN(d.getTime())) return String(value);
    return d.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
  }

  function showPlaceholder() {
    const root = document.getElementById('reviews');
    root.innerHTML =
      '<div class="placeholder">' +
        '<h2>Reviews coming soon</h2>' +
        '<p>Five-star guest reviews will appear here once public Turo feedback is available.</p>' +
      '</div>';
  }

  function render(reviews) {
    const root = document.getElementById('reviews');
    const fiveStar = (Array.isArray(reviews) ? reviews : [])
      .filter((r) => Number(r.rating) === 5 && r.text)
      .sort((a, b) => new Date(b.date) - new Date(a.date));

    if (!fiveStar.length) {
      showPlaceholder();
      return;
    }

    root.innerHTML = fiveStar.map((r) => {
      const id = String(r.listingId || '');
      const name = NAMES[id] || r.vehicleName || 'Fleet vehicle';
      const img = id ? ('images/' + id + '_1.jpg') : '';
      const who = r.reviewerFirstName || 'Guest';
      const when = formatDate(r.date);
      return (
        '<article class="review">' +
          (img
            ? '<img class="review-photo" src="' + escapeHtml(img) + '" alt="' + escapeHtml(name) + '" loading="lazy">'
            : '<div class="review-photo" aria-hidden="true"></div>') +
          '<div>' +
            '<div class="review-meta">' +
              '<span class="review-vehicle">“' + escapeHtml(name) + '”</span>' +
              '<span>' + escapeHtml(who) + (when ? ' · ' + escapeHtml(when) : '') + '</span>' +
            '</div>' +
            '<p class="review-text">' + escapeHtml(r.text) + '</p>' +
          '</div>' +
        '</article>'
      );
    }).join('');
  }

  fetch('reviews.json', { cache: 'no-store' })
    .then((res) => (res.ok ? res.json() : []))
    .then(render)
    .catch(showPlaceholder);
})();
</script>
</body>
</html>
